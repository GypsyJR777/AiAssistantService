plugins {
    id 'org.jetbrains.kotlin.jvm' version "2.3.10"
    id "org.jetbrains.kotlin.plugin.allopen" version "2.3.10"
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'

    implementation "dev.langchain4j:langchain4j:${langchain4j_version}"
    implementation "dev.langchain4j:langchain4j-web-search-engine-google-custom:${langchain4j_version}-beta19"
    implementation "dev.langchain4j:langchain4j-ollama:${langchain4j_version}"
    implementation "dev.langchain4j:langchain4j-http-client-jdk:${langchain4j_version}"
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4j_version}"

    implementation("io.ktor:ktor-client-core:${ktor_client_version}")
    implementation("io.ktor:ktor-client-cio:${ktor_client_version}")

    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.19.2")
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.19.2")

    implementation 'org.jsoup:jsoup:1.20.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
allOpen {
    annotation("jakarta.ws.rs.Path")
    annotation("jakarta.enterprise.context.ApplicationScoped")
    annotation("jakarta.persistence.Entity")
}

compileKotlin {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_21
    kotlinOptions.javaParameters = true
}

compileTestKotlin {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_21
}
