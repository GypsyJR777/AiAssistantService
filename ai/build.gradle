plugins {
    id 'org.jetbrains.kotlin.jvm' version "2.1.21"
    id "org.jetbrains.kotlin.plugin.allopen" version "2.1.21"
}

repositories {
    mavenCentral()
    mavenLocal()
}

dependencies {
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'

    implementation "dev.langchain4j:langchain4j:1.0.1"
    implementation 'dev.langchain4j:langchain4j-web-search-engine-google-custom:1.0.1-beta6'
    implementation 'dev.langchain4j:langchain4j-ollama:1.0.1-beta6'

    implementation("io.ktor:ktor-client-core:3.1.3")
    implementation("io.ktor:ktor-client-cio:3.1.3")

    implementation 'org.jsoup:jsoup:1.20.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

test {
    systemProperty "java.util.logging.manager", "org.jboss.logmanager.LogManager"
}
allOpen {
    annotation("jakarta.ws.rs.Path")
    annotation("jakarta.enterprise.context.ApplicationScoped")
    annotation("jakarta.persistence.Entity")
}

compileKotlin {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_21
    kotlinOptions.javaParameters = true
}

compileTestKotlin {
    kotlinOptions.jvmTarget = JavaVersion.VERSION_21
}
